<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>TradingView Daily Screener</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="page">

    <header class="header">
        <div>
            <h1>TradingView Daily Screener</h1>
            <p class="subtitle">
                Daily screening results and new-stock changes
            </p>
        </div>

        <div class="header-actions">
            <button id="themeButton" class="theme-button" type="button">
                🌙 Dark
            </button>

            <button id="refreshButton" class="refresh-button" type="button">
                Refresh
            </button>
        </div>
    </header>


    <nav class="tabs">
        <button
            class="tab active"
            data-market="malaysia"
        >
            🇲🇾 Malaysia
        </button>

        <button
            class="tab"
            data-market="us"
        >
            🇺🇸 US
        </button>

        <button
            class="tab"
            data-market="watchlist"
        >
            ⭐ Watchlist
        </button>
    </nav>


    <main>

        <section id="screenerControls" class="filter-card">
            <div class="section-title-row">
                <div>
                    <h2 id="marketTitle">Malaysia</h2>
                    <p id="marketSubtitle">
                        TradingView screening filters
                    </p>
                </div>

                <span class="status" id="status">
                    Loading...
                </span>
            </div>

            <div id="filters" class="filters"></div>

            <div class="history-control">
                <label for="daysSelect">
                    Check differences for
                </label>

                <select id="daysSelect">
                    <option value="3">3 days</option>
                    <option value="5">5 days</option>
                    <option value="7">7 days</option>
                    <option value="10">10 days</option>
                    <option value="15">15 days</option>
                    <option value="30">30 days</option>
                    <option value="60">60 days</option>
                    <option value="90">90 days</option>
                    <option value="365">1 year</option>
                </select>
            </div>
        </section>


        <section id="days"></section>


        <section id="watchlistSection" class="watchlist-section hidden">
            <div class="filter-card">
                <div class="section-title-row">
                    <div>
                        <h2>⭐ Watchlist</h2>
                        <p>
                            Stocks saved here remain until you remove them.
                        </p>
                    </div>

                    <span class="status" id="watchlistStatus">
                        Loading...
                    </span>
                </div>

                <div id="watchlist"></div>
            </div>
        </section>

    </main>

</div>


<script>
let currentMarket = "malaysia";
let selectedDays = Number(
    localStorage.getItem("tv-dashboard-days") || "3"
);


function escapeHtml(value) {
    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatNumber(value) {
    if (value === null || value === undefined || value === "") {
        return "-";
    }

    const number = Number(value);

    if (Number.isNaN(number)) {
        return escapeHtml(value);
    }

    return number.toLocaleString(
        undefined,
        {
            maximumFractionDigits: 2
        }
    );
}


function formatVolume(value) {
    if (value === null || value === undefined || value === "") {
        return "-";
    }

    const number = Number(value);

    if (Number.isNaN(number)) {
        return escapeHtml(value);
    }

    if (number >= 1_000_000_000) {
        return (number / 1_000_000_000).toFixed(2) + "B";
    }

    if (number >= 1_000_000) {
        return (number / 1_000_000).toFixed(2) + "M";
    }

    if (number >= 1_000) {
        return (number / 1_000).toFixed(2) + "K";
    }

    return number.toLocaleString();
}


function tradingViewUrl(ticker) {
    if (!ticker) {
        return "#";
    }

    return "https://www.tradingview.com/chart/d1JfAmuY/?symbol=" +
        encodeURIComponent(String(ticker));
}


function renderFilters(filters) {
    const container = document.getElementById("filters");

    container.innerHTML = filters
        .map(
            filter => `
                <span class="filter-chip">
                    ${escapeHtml(filter)}
                </span>
            `
        )
        .join("");
}


function watchlistButton(stock, market) {
    const active = stock.watchlisted;

    return `
        <button
            class="watch-button ${active ? "active" : ""}"
            type="button"
            title="${active ? "Remove from watchlist" : "Add to watchlist"}"
            onclick="toggleWatchlist(event, ${JSON.stringify(
                market
            )}, ${JSON.stringify(
                stock.ticker
            )}, ${JSON.stringify(
                stock.name || ""
            )}, ${JSON.stringify(
                stock.description || ""
            )})"
        >
            ${active ? "★" : "☆"}
        </button>
    `;
}


function renderStockRow(stock, isNew, market) {
    const badge = isNew
        ? '<span class="new-badge">NEW</span>'
        : "";

    return `
        <tr>
            <td class="watch-column">
                ${watchlistButton(stock, market)}
            </td>

            <td>
                <a
                    class="ticker"
                    href="${tradingViewUrl(stock.ticker)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ${escapeHtml(stock.ticker)}
                </a>
                ${badge}
            </td>

            <td>
                ${escapeHtml(stock.name)}
            </td>

            <td class="number">
                ${formatNumber(stock.close)}
            </td>

            <td class="number">
                ${formatVolume(stock.volume)}
            </td>
        </tr>
    `;
}


function renderNewSection(day, market) {
    if (day.new.length === 0) {
        return `
            <div class="new-section empty">
                <div class="new-title">
                    🟢 New since previous scan
                </div>

                <div class="empty-message">
                    No new stocks.
                </div>
            </div>
        `;
    }

    const previousDate = day.new[0].previous_date;

    return `
        <div class="new-section">
            <div class="new-title">
                🟢 New since ${escapeHtml(previousDate)}
                <span class="count-badge">
                    ${day.new.length}
                </span>
            </div>

            <div class="new-grid">
                ${
                    day.new
                        .map(
                            stock => `
                                <div class="new-stock">
                                    <div class="new-stock-top">
                                        ${watchlistButton(
                                            stock,
                                            market
                                        )}

                                        <a
                                            href="${tradingViewUrl(stock.ticker)}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            <strong>
                                                ${escapeHtml(
                                                    stock.ticker
                                                )}
                                            </strong>
                                        </a>
                                    </div>

                                    <span>
                                        ${escapeHtml(stock.name)}
                                    </span>
                                </div>
                            `
                        )
                        .join("")
                }
            </div>
        </div>
    `;
}


function renderDay(day, market) {
    return `
        <section class="day-card">

            <div class="day-header">
                <div>
                    <h2>${escapeHtml(day.date)}</h2>

                    <div class="day-meta">
                        ${day.count} stocks matched
                    </div>
                </div>

                <div class="day-new-count">
                    ${day.new_count} new
                </div>
            </div>


            ${renderNewSection(day, market)}


            <div class="selected-section">

                <div class="selected-title">
                    📊 Today's Selected Stocks
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th class="watch-column">Watch</th>
                                <th>Ticker</th>
                                <th>Name</th>
                                <th>Close</th>
                                <th>Volume</th>
                            </tr>
                        </thead>

                        <tbody>
                            ${
                                day.results.length
                                    ? day.results
                                        .map(
                                            stock =>
                                                renderStockRow(
                                                    stock,
                                                    false,
                                                    market
                                                )
                                        )
                                        .join("")
                                    : `
                                        <tr>
                                            <td
                                                colspan="5"
                                                class="empty-table"
                                            >
                                                No results for this date.
                                            </td>
                                        </tr>
                                    `
                            }
                        </tbody>
                    </table>
                </div>

            </div>

        </section>
    `;
}


async function toggleWatchlist(
    event,
    market,
    ticker,
    name,
    description
) {
    event.preventDefault();
    event.stopPropagation();

    const button = event.currentTarget;
    const isActive = button.classList.contains("active");

    button.disabled = true;

    try {
        const response = await fetch(
            "/api/watchlist",
            {
                method: isActive ? "DELETE" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    market,
                    ticker,
                    name,
                    description
                })
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        if (currentMarket === "watchlist") {
            await loadWatchlist();
        } else {
            await loadMarket(currentMarket);
        }
    } catch (error) {
        console.error(error);
        alert("Unable to update the watchlist.");
        button.disabled = false;
    }
}


function renderWatchlist(stocks) {
    const container = document.getElementById("watchlist");

    if (stocks.length === 0) {
        container.innerHTML = `
            <div class="no-data">
                Your watchlist is empty.
                <br><br>
                Click ☆ beside a stock to add it.
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="table-wrapper">
            <table class="watchlist-table">
                <thead>
                    <tr>
                        <th>Market</th>
                        <th>Ticker</th>
                        <th>Name</th>
                        <th>Added</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                    ${
                        stocks
                            .map(
                                stock => `
                                    <tr>
                                        <td>
                                            ${escapeHtml(
                                                stock.market
                                            )}
                                        </td>

                                        <td>
                                            <a
                                                class="ticker"
                                                href="${tradingViewUrl(
                                                    stock.ticker
                                                )}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                            >
                                                ${escapeHtml(
                                                    stock.ticker
                                                )}
                                            </a>
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                stock.name
                                            )}
                                        </td>

                                        <td>
                                            ${escapeHtml(
                                                stock.added_at
                                            )}
                                        </td>

                                        <td>
                                            <button
                                                class="remove-watch-button"
                                                type="button"
                                                onclick="removeWatchlist(
                                                    ${JSON.stringify(
                                                        stock.market
                                                    )},
                                                    ${JSON.stringify(
                                                        stock.ticker
                                                    )}
                                                )"
                                            >
                                                Remove
                                            </button>
                                        </td>
                                    </tr>
                                `
                            )
                            .join("")
                    }
                </tbody>
            </table>
        </div>
    `;
}


async function loadWatchlist() {
    const status = document.getElementById("watchlistStatus");
    const container = document.getElementById("watchlist");

    status.textContent = "Loading...";
    container.innerHTML = `
        <div class="loading">
            Loading watchlist...
        </div>
    `;

    try {
        const response = await fetch(
            `/api/watchlist?t=${Date.now()}`
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        renderWatchlist(data.watchlist);

        status.textContent =
            `${data.watchlist.length} stock` +
            `${data.watchlist.length === 1 ? "" : "s"}`;
    } catch (error) {
        console.error(error);

        status.textContent = "Error";

        container.innerHTML = `
            <div class="error">
                Unable to load the watchlist.
            </div>
        `;
    }
}


async function removeWatchlist(market, ticker) {
    const confirmed = window.confirm(
        `Remove ${ticker} from your watchlist?`
    );

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(
            "/api/watchlist",
            {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    market,
                    ticker
                })
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        await loadWatchlist();
    } catch (error) {
        console.error(error);
        alert("Unable to remove the stock from the watchlist.");
    }
}


function showScreener() {
    document
        .getElementById("screenerControls")
        .classList.remove("hidden");

    document
        .getElementById("days")
        .classList.remove("hidden");

    document
        .getElementById("watchlistSection")
        .classList.add("hidden");
}


function showWatchlist() {
    document
        .getElementById("screenerControls")
        .classList.add("hidden");

    document
        .getElementById("days")
        .classList.add("hidden");

    document
        .getElementById("watchlistSection")
        .classList.remove("hidden");

    loadWatchlist();
}


async function loadMarket(market) {
    currentMarket = market;

    showScreener();

    const status = document.getElementById("status");
    const daysContainer = document.getElementById("days");

    status.textContent = "Loading...";

    daysContainer.innerHTML = `
        <div class="loading">
            Loading screening data...
        </div>
    `;

    try {
        const response = await fetch(
            `/api/${market}?days=${selectedDays}&t=${Date.now()}`
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        document.getElementById("marketTitle")
            .textContent = data.market;

        renderFilters(data.filters);

        if (data.days.length === 0) {
            daysContainer.innerHTML = `
                <div class="no-data">
                    No screening data found.
                </div>
            `;
        } else {
            daysContainer.innerHTML = data.days
                .map(day => renderDay(day, data.market))
                .join("");
        }

        status.textContent =
            `Showing ${data.days.length} of ` +
            `${selectedDays} requested scan days`;

    } catch (error) {
        console.error(error);

        status.textContent = "Error";

        daysContainer.innerHTML = `
            <div class="error">
                Unable to load screening data.
                <br><br>
                Make sure the SQLite database exists and
                the screener has been run.
            </div>
        `;
    }
}


document
    .querySelectorAll(".tab")
    .forEach(button => {
        button.addEventListener(
            "click",
            () => {
                document
                    .querySelectorAll(".tab")
                    .forEach(tab =>
                        tab.classList.remove("active")
                    );

                button.classList.add("active");

                if (button.dataset.market === "watchlist") {
                    currentMarket = "watchlist";
                    showWatchlist();
                } else {
                    loadMarket(
                        button.dataset.market
                    );
                }
            }
        );
    });


const daysSelect = document.getElementById("daysSelect");

if (
    [3, 5, 7, 10, 15, 30, 60, 90, 365]
        .includes(selectedDays)
) {
    daysSelect.value = String(selectedDays);
} else {
    selectedDays = 3;
    daysSelect.value = "3";
}


daysSelect.addEventListener(
    "change",
    () => {
        selectedDays = Number(
            daysSelect.value
        );

        localStorage.setItem(
            "tv-dashboard-days",
            String(selectedDays)
        );

        if (currentMarket !== "watchlist") {
            loadMarket(currentMarket);
        }
    }
);


const savedTheme = localStorage.getItem(
    "tv-dashboard-theme"
);

if (savedTheme === "dark") {
    document.body.classList.add("dark");
}


function updateThemeButton() {
    const button = document.getElementById("themeButton");

    if (document.body.classList.contains("dark")) {
        button.textContent = "☀️ Light";
    } else {
        button.textContent = "🌙 Dark";
    }
}


document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        () => {
            document.body.classList.toggle("dark");

            const isDark =
                document.body.classList.contains("dark");

            localStorage.setItem(
                "tv-dashboard-theme",
                isDark ? "dark" : "light"
            );

            updateThemeButton();
        }
    );


updateThemeButton();


document
    .getElementById("refreshButton")
    .addEventListener(
        "click",
        () => {
            if (currentMarket === "watchlist") {
                loadWatchlist();
            } else {
                loadMarket(currentMarket);
            }
        }
    );


loadMarket("malaysia");
</script>

</body>
</html>
